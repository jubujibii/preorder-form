<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>คู่มือลูกค้า PRE2PET</title>
<style>
:root{--bg:#F8F3E9;--ink:#3B2A20;--terra:#E5704A;--line:#E8DCC8}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:56px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:10px 12px;-webkit-overflow-scrolling:touch}
nav a{flex:none;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;white-space:nowrap}
nav a:active{background:var(--terra);color:#fff;border-color:var(--terra)}
main{max-width:720px;margin:0 auto}
img{display:block;width:100%;height:auto}
section+section{border-top:1px solid var(--line)}
footer{padding:20px 16px 32px;text-align:center;font-size:14px;color:#7A5C48}
</style>
</head>
<body>
<nav>
<a href="#p1">ภาพรวม</a><a href="#p2">ลงทะเบียน</a><a href="#p3">สั่งสินค้า</a><a href="#p4">ชำระเงิน</a><a href="#p5">ติดตามสถานะ</a>
</nav>
<main>
<section id="p1"><img src="manual/1.jpg" alt="ภาพรวมขั้นตอนการสั่งซื้อ"></section>
<section id="p2"><img src="manual/2.jpg" alt="ลงทะเบียนครั้งแรก" loading="lazy"></section>
<section id="p3"><img src="manual/3.jpg" alt="สั่งสินค้า แก้ไข และยกเลิก" loading="lazy"></section>
<section id="p4"><img src="manual/4.jpg" alt="ชำระเงินและแนบสลิป" loading="lazy"></section>
<section id="p5"><img src="manual/5.jpg" alt="ติดตามสถานะและคืนเงิน" loading="lazy"></section>
</main>
<footer>ติดต่อร้าน: พิมพ์ทักแชท LINE ของ PRE2PET</footer>
</body>
</html>
