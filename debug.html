<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ทดสอบระบบ (ชั่วคราว)</title>
<style>body{font:15px/1.6 system-ui,sans-serif;padding:16px}pre{white-space:pre-wrap;word-break:break-all;background:#f4f4f4;padding:8px;border-radius:6px}button{font-size:16px;padding:10px 14px;margin:6px 0}</style>
</head>
<body>
<h3>ทดสอบเชื่อม LINE ↔ Apps Script</h3>
<pre id="out">กำลังโหลด…</pre>
<button id="push" hidden>ทดสอบ push เข้าแชทตัวเอง</button>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js"></script>
<script>
var out = document.getElementById('out');
function log(k, v) { out.textContent += '\n' + k + ': ' + (typeof v === 'string' ? v : JSON.stringify(v)); }
function call(body) {
  return fetch(APP_CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(function (r) { return r.text(); });
}
(async function () {
  out.textContent = 'เริ่ม';
  try {
    await liff.init({ liffId: APP_CONFIG.LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    var p = await liff.getProfile();
    log('displayName', p.displayName);
    log('isInClient', liff.isInClient());
    try { var f = await liff.getFriendship(); log('friendFlag', f.friendFlag); } catch (e) { log('friendship error', String(e)); }
    if (!APP_CONFIG.API_URL) { log('API_URL', 'ยังว่าง — ใส่ URL ของ Apps Script ใน config.js'); return; }
    try { log('whoami', await call({ action: 'whoami', idToken: liff.getIDToken() })); }
    catch (e) { log('whoami ERROR (อาจเป็น CORS)', String(e)); }
    var b = document.getElementById('push'); b.hidden = false;
    b.onclick = async function () {
      try { log('pushSelf', await call({ action: 'pushSelf', idToken: liff.getIDToken() })); }
      catch (e) { log('pushSelf ERROR', String(e)); }
    };
  } catch (e) { log('ERROR', String(e)); }
})();
</script>
</body>
</html>
